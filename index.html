<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f14" />
  <title>🧠 Second Brain</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         #0f0f14;
      --surface:    #16161f;
      --card:       #1e1e2a;
      --card-hover: #232330;
      --border:     #2a2a3a;
      --border-dim: #222230;
      --accent:     #8b5cf6;
      --accent-low: #6d28d9;
      --accent-glow:rgba(139,92,246,.18);
      --text:       #e2e2ee;
      --muted:      #7878a0;
      --del:        #ef4444;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LAYOUT WRAPPER ── */
    .layout { max-width: 540px; margin: 0 auto; }

    /* ── HEADER ── */
    .header-wrap {
      position: sticky; top: 0; z-index: 200;
      background: var(--bg);
      border-bottom: 1px solid var(--border-dim);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .header {
      max-width: 540px; margin: 0 auto;
      padding: 14px 16px 10px;
    }
    .header-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .logo {
      font-size: 17px; font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #a78bfa, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 11px; color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2px 9px; border-radius: 20px;
    }
    /* search */
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
      width: 16px; height: 16px; flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px 8px 34px;
      color: var(--text); font-size: 14px;
      outline: none; transition: border-color .2s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }
    .search-clear {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted); font-size: 16px;
      cursor: pointer; display: none; line-height: 1;
    }

    /* ── INPUT AREA ── */
    .input-section {
      max-width: 540px; margin: 0 auto;
      padding: 12px 16px;
    }
    .input-box {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .note-textarea {
      width: 100%;
      min-height: 88px; max-height: 220px;
      background: transparent; border: none;
      padding: 14px 14px 6px;
      color: var(--text); font-size: 15px;
      font-family: inherit; resize: none; outline: none;
      line-height: 1.55;
    }
    .note-textarea::placeholder { color: var(--muted); }
    /* live tag preview */
    .live-tags {
      display: flex; flex-wrap: wrap; gap: 5px;
      padding: 4px 14px 0; min-height: 0;
    }
    .live-tag {
      font-size: 11px; padding: 2px 8px;
      border-radius: 10px; font-weight: 600;
      animation: popIn .15s ease;
    }
    .input-footer {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 8px 12px 10px;
    }
    .input-hint { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .save-btn {
      background: var(--accent);
      color: #fff; border: none;
      border-radius: 10px;
      padding: 7px 18px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background .2s, transform .1s;
      letter-spacing: -0.2px;
    }
    .save-btn:active { transform: scale(.96); background: var(--accent-low); }

    /* ── TAG FILTER BAR ── */
    .tag-bar-wrap {
      position: sticky; top: 89px; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border-dim);
    }
    .tag-bar {
      max-width: 540px; margin: 0 auto;
      padding: 8px 16px;
      display: flex; gap: 7px;
      overflow-x: auto; scrollbar-width: none;
    }
    .tag-bar::-webkit-scrollbar { display: none; }
    .tag-pill {
      flex-shrink: 0;
      padding: 4px 13px;
      border-radius: 20px;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all .18s;
      white-space: nowrap;
    }
    .tag-pill:hover { border-color: var(--accent); color: var(--accent); }
    .tag-pill.active {
      background: var(--accent); border-color: var(--accent);
      color: #fff; font-weight: 600;
    }

    /* ── NOTES ── */
    .notes-section {
      max-width: 540px; margin: 0 auto;
      padding: 12px 16px 100px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .empty {
      text-align: center;
      padding: 64px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 44px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; margin-bottom: 4px; }
    .empty-sub { font-size: 13px; opacity: .7; }

    /* ── NOTE CARD ── */
    .note-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 14px 12px;
      animation: slideIn .2s ease;
      transition: border-color .2s, background .2s;
    }
    .note-card:hover { background: var(--card-hover); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .card-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .card-time { font-size: 11px; color: var(--muted); }
    .card-actions { display: flex; gap: 2px; }
    .card-btn {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      padding: 4px 7px; border-radius: 8px;
      font-size: 15px; transition: all .15s;
      line-height: 1;
    }
    .card-btn:hover { background: var(--border); color: var(--text); }
    .card-btn.del:hover { background: rgba(239,68,68,.12); color: var(--del); }

    /* markdown */
    .md-body { font-size: 14px; line-height: 1.65; color: var(--text); word-break: break-word; }
    .md-body h1 { font-size: 18px; margin: 6px 0 4px; }
    .md-body h2 { font-size: 16px; margin: 5px 0 3px; }
    .md-body h3 { font-size: 14px; margin: 4px 0 2px; }
    .md-body p  { margin-bottom: 5px; }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body ul, .md-body ol { padding-left: 18px; margin-bottom: 5px; }
    .md-body li { margin-bottom: 2px; }
    .md-body code {
      background: rgba(139,92,246,.12);
      color: #c4b5fd;
      padding: 1px 5px; border-radius: 5px;
      font-size: 12px; font-family: 'Fira Code', monospace;
    }
    .md-body pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px; margin: 8px 0;
      overflow-x: auto;
    }
    .md-body pre code { background: none; color: #a78bfa; padding: 0; }
    .md-body blockquote {
      border-left: 3px solid var(--accent);
      padding: 2px 10px; margin: 6px 0;
      color: var(--muted);
    }
    .md-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .md-body strong { color: #d4b8ff; }
    .md-body em { color: #c4b5fd; }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .md-body input[type="checkbox"] { accent-color: var(--accent); margin-right: 5px; }

    /* card tags */
    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .card-tag {
      font-size: 11px; padding: 2px 9px;
      border-radius: 10px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .card-tag:hover { opacity: .75; }

    /* edit mode */
    .edit-textarea {
      width: 100%;
      min-height: 100px;
      background: var(--bg);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text); font-size: 14px;
      font-family: inherit; resize: vertical; outline: none;
      line-height: 1.55; margin-bottom: 8px;
    }
    .edit-btns { display: flex; gap: 7px; justify-content: flex-end; }
    .edit-cancel {
      background: var(--border); color: var(--text);
      border: none; border-radius: 8px;
      padding: 5px 14px; font-size: 13px; cursor: pointer;
    }
    .edit-save {
      background: var(--accent); color: #fff;
      border: none; border-radius: 8px;
      padding: 5px 14px; font-size: 13px;
      font-weight: 600; cursor: pointer;
    }

    /* ── TAG COLOR SYSTEM ── */
    .tc-idea    { background: rgba(139,92,246,.18);  color: #a78bfa; }
    .tc-todo    { background: rgba(239,68,68,.18);   color: #f87171; }
    .tc-insp    { background: rgba(251,191,36,.18);  color: #fbbf24; }
    .tc-work    { background: rgba(59,130,246,.18);  color: #60a5fa; }
    .tc-learn   { background: rgba(16,185,129,.18);  color: #34d399; }
    .tc-q       { background: rgba(6,182,212,.18);   color: #22d3ee; }
    .tc-note    { background: rgba(249,115,22,.18);  color: #fb923c; }
    .tc-default { background: rgba(120,120,160,.15); color: #a0a0c0; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (min-width: 541px) {
      .tag-bar-wrap { top: 93px; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<div class="header-wrap">
  <div class="header">
    <div class="header-row">
      <span class="logo">🧠 Second Brain</span>
      <span class="badge" id="badge">0개</span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" id="searchInput" type="search"
        placeholder="메모 검색..." autocomplete="off"
        oninput="onSearch(this)" />
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>
</div>

<!-- ── INPUT ── -->
<div class="input-section">
  <div class="input-box">
    <textarea class="note-textarea" id="noteInput"
      placeholder="영감이나 메모를 입력하세요…&#10;#아이디어 #할일 #영감 태그를 붙여보세요"
      oninput="onInputChange(this)"></textarea>
    <div class="live-tags" id="liveTags"></div>
    <div class="input-footer">
      <div class="input-hint">
        # 태그로 자동 분류<br>
        <span style="opacity:.6">Ctrl+Enter 저장</span>
      </div>
      <button class="save-btn" onclick="saveNote()">저장 ✨</button>
    </div>
  </div>
</div>

<!-- ── TAG FILTER ── -->
<div class="tag-bar-wrap">
  <div class="tag-bar" id="tagBar">
    <div class="tag-pill active" data-tag="all" onclick="setFilter('all')">전체</div>
  </div>
</div>

<!-- ── NOTES ── -->
<div class="notes-section" id="notesSection"></div>

<script>
/* ── CONFIG ── */
marked.setOptions({ breaks: true, gfm: true });

const TAG_MAP = {
  '#아이디어':'tc-idea','#idea':'tc-idea','#아이디어들':'tc-idea',
  '#할일':'tc-todo','#todo':'tc-todo','#투두':'tc-todo',
  '#영감':'tc-insp','#inspiration':'tc-insp','#영감들':'tc-insp',
  '#업무':'tc-work','#work':'tc-work','#회사':'tc-work',
  '#학습':'tc-learn','#learn':'tc-learn','#공부':'tc-learn','#공부중':'tc-learn',
  '#질문':'tc-q','#question':'tc-q','#qna':'tc-q',
  '#메모':'tc-note','#note':'tc-note','#노트':'tc-note',
};

function tagClass(t) { return TAG_MAP[t.toLowerCase()] ?? 'tc-default'; }

/* ── STATE ── */
let notes = [];
let activeFilter = 'all';
let searchQ = '';

/* ── STORAGE ── */
const KEY = 'sb_notes_v2';
function load() {
  try { notes = JSON.parse(localStorage.getItem(KEY)) || []; } catch { notes = []; }
  render();
}
function persist() { localStorage.setItem(KEY, JSON.stringify(notes)); }

/* ── HELPERS ── */
function extractTags(text) {
  return [...new Set((text.match(/#[\w가-힣]+/g) || []))];
}

function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60e3)   return '방금 전';
  if (d < 3600e3) return `${Math.floor(d/60e3)}분 전`;
  if (d < 86400e3)return `${Math.floor(d/3600e3)}시간 전`;
  const dt = new Date(ts);
  return `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function safeHTML(md) {
  // basic XSS guard: no script tags from user content
  return marked.parse(md);
}

/* ── SAVE ── */
function saveNote() {
  const ta = document.getElementById('noteInput');
  const content = ta.value.trim();
  if (!content) return;

  notes.unshift({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    content,
    tags: extractTags(content),
    createdAt: Date.now(),
  });
  persist();

  ta.value = '';
  ta.style.height = '';
  document.getElementById('liveTags').innerHTML = '';

  if (navigator.vibrate) navigator.vibrate(40);
  render();
}

/* ── DELETE ── */
function deleteNote(id) {
  notes = notes.filter(n => n.id !== id);
  persist();
  render();
}

/* ── EDIT ── */
function startEdit(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  const card = document.getElementById('c-' + id);
  card.innerHTML = `
    <textarea class="edit-textarea" id="et-${id}">${escAttr(note.content)}</textarea>
    <div class="edit-btns">
      <button class="edit-cancel" onclick="render()">취소</button>
      <button class="edit-save" onclick="commitEdit('${id}')">저장</button>
    </div>`;
  const ta = document.getElementById('et-' + id);
  ta.focus();
  ta.selectionStart = ta.selectionEnd = ta.value.length;
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey||e.metaKey) && e.key==='Enter') commitEdit(id);
    if (e.key==='Escape') render();
  });
}

function commitEdit(id) {
  const ta = document.getElementById('et-' + id);
  const content = ta.value.trim();
  if (!content) return;
  const idx = notes.findIndex(n => n.id === id);
  if (idx < 0) return;
  notes[idx] = { ...notes[idx], content, tags: extractTags(content) };
  persist();
  render();
}

function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ── FILTER & SEARCH ── */
function setFilter(tag) {
  activeFilter = tag;
  document.querySelectorAll('.tag-pill').forEach(p =>
    p.classList.toggle('active', p.dataset.tag === tag));
  renderNotes();
}

function onSearch(el) {
  searchQ = el.value.toLowerCase();
  document.getElementById('searchClear').style.display = searchQ ? 'block' : 'none';
  renderNotes();
}

function clearSearch() {
  const el = document.getElementById('searchInput');
  el.value = ''; searchQ = '';
  document.getElementById('searchClear').style.display = 'none';
  renderNotes();
}

function filtered() {
  return notes.filter(n => {
    const tagOk = activeFilter === 'all' || n.tags.includes(activeFilter);
    const srOk  = !searchQ || n.content.toLowerCase().includes(searchQ);
    return tagOk && srOk;
  });
}

/* ── LIVE TAG PREVIEW ── */
function onInputChange(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 220) + 'px';

  const tags = extractTags(ta.value);
  const container = document.getElementById('liveTags');
  container.innerHTML = tags.map(t =>
    `<span class="live-tag ${tagClass(t)}">${t}</span>`
  ).join('');
  container.style.paddingBottom = tags.length ? '8px' : '0';
}

/* ── RENDER TAG BAR ── */
function renderTagBar() {
  const allTags = [...new Set(notes.flatMap(n => n.tags))];
  const bar = document.getElementById('tagBar');
  const active = activeFilter;

  bar.innerHTML = `<div class="tag-pill ${active==='all'?'active':''}" data-tag="all" onclick="setFilter('all')">전체</div>`;
  allTags.forEach(t => {
    bar.innerHTML += `<div class="tag-pill ${active===t?'active':''} ${tagClass(t)}-pill"
      data-tag="${escAttr(t)}" onclick="setFilter('${escAttr(t)}')">${t}</div>`;
  });
  // If active tag no longer exists, reset
  if (active !== 'all' && !allTags.includes(active)) {
    activeFilter = 'all';
    bar.querySelector('[data-tag="all"]').classList.add('active');
  }
}

/* ── RENDER NOTES ── */
function renderNotes() {
  const section = document.getElementById('notesSection');
  const list = filtered();

  document.getElementById('badge').textContent = notes.length + '개';

  if (!list.length) {
    section.innerHTML = `
      <div class="empty">
        <div class="empty-icon">${notes.length===0?'🌱':'🔍'}</div>
        <div class="empty-title">${notes.length===0?'아직 메모가 없어요':'검색 결과가 없어요'}</div>
        <div class="empty-sub">${notes.length===0?'첫 번째 생각을 기록해보세요':'다른 키워드로 검색해보세요'}</div>
      </div>`;
    return;
  }

  section.innerHTML = list.map(n => `
    <div class="note-card" id="c-${n.id}">
      <div class="card-header">
        <span class="card-time">${timeAgo(n.createdAt)}</span>
        <div class="card-actions">
          <button class="card-btn" onclick="startEdit('${n.id}')" title="편집">✏️</button>
          <button class="card-btn del" onclick="deleteNote('${n.id}')" title="삭제">🗑️</button>
        </div>
      </div>
      <div class="md-body">${safeHTML(n.content)}</div>
      ${n.tags.length ? `
        <div class="card-tags">
          ${n.tags.map(t => `<span class="card-tag ${tagClass(t)}" onclick="setFilter('${escAttr(t)}')">${t}</span>`).join('')}
        </div>` : ''}
    </div>`).join('');
}

function render() { renderTagBar(); renderNotes(); }

/* ── KEYBOARD SHORTCUT ── */
document.getElementById('noteInput').addEventListener('keydown', e => {
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter') { e.preventDefault(); saveNote(); }
});

/* ── INIT ── */
load();
</script>
</body>
</html>
