<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11171c">
<meta name="robots" content="noindex,nofollow">
<title>1급 비서관</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 한 화면 콘솔. 왼쪽 = 속기록, 오른쪽 = 비서 브리핑(관인 붉은색). 폰은 위아래. */
:root{
  --bg:#eef1f3; --paper:#fff; --ink:#18232d; --muted:#5f6d78; --line:#d5dce1;
  --seal:#b3261e; --seal-soft:#f7e3e1; --me:#1f4e79; --me-soft:#e3edf6; --other:#3d5a3a; --other-soft:#e6efe4;
  --warn:#9a6200; --warn-soft:#fbefd9; --ok:#2e7d4f; --note-bg:#fffdf6;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11171c; --paper:#182128; --ink:#e6ebef; --muted:#93a1ac; --line:#2c3a44;
  --seal:#e5675c; --seal-soft:#3a2120; --me:#8fbbe6; --me-soft:#1d2e3e; --other:#a5c99d; --other-soft:#1f2d1e;
  --warn:#e6b25a; --warn-soft:#352914; --ok:#6fc28f; --note-bg:#1d2329; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;max-width:1400px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seal{width:34px;height:34px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1;transform:rotate(-4deg)}
h1{font-family:var(--f-display);font-size:19px;margin:0;font-weight:800}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto;display:flex;gap:7px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.live .dot{background:var(--seal);animation:pulse 1.2s infinite}
.paused .dot{background:var(--warn)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--me);outline-offset:2px}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
button.danger{border-color:var(--seal);color:var(--seal);font-weight:600}
button.big{padding:10px 18px;font-size:16px}
button:disabled{opacity:.45;cursor:default}
.setup{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1 1 150px;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%}
.memo-chip{font-size:12.5px;color:var(--me);background:var(--me-soft);border-radius:99px;padding:3px 10px;width:100%}
.split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.35fr .95fr;grid-template-areas:"script notes mon";gap:8px}
.p-script{grid-area:script}.p-notes{grid-area:notes}.p-mon{grid-area:mon}
@media (max-width:1000px){.split{grid-template-columns:1.25fr 1fr;grid-template-rows:34% 1fr;grid-template-areas:"script mon" "notes mon"}}
@media (max-width:760px){.split{gap:6px} body{padding-left:8px;padding-right:8px} .pane-h{padding:6px 8px} .scroll{padding:8px} .line{grid-template-columns:1fr;gap:1px} .line p{font-size:13.5px} .who{justify-self:start}}
.mon{display:flex;flex-direction:column;gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.tile h3{margin:0 0 5px;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.05em;display:flex;justify-content:space-between;gap:6px}
.tile h3 span{font-family:var(--f-mono);font-weight:400}
.mood-big{font-family:var(--f-display);font-size:18px;font-weight:600}
.spark{width:100%;height:40px;display:block}
.gauges{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center;font-size:12.5px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.split2{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:4px 0}
.split2 i{display:block;height:100%}
.sig{font-size:13px;margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.sig li{padding:4px 8px;border-radius:7px}
.sig .warn{background:var(--warn-soft);color:var(--warn)} .sig .good{background:var(--other-soft);color:var(--other)}
.stages{display:flex;gap:3px}
.stages i{flex:1;font-style:normal;font-size:10.5px;text-align:center;padding:3px 0;border-radius:4px;background:var(--bg);color:var(--muted)}
.stages i.on{background:var(--ink);color:var(--paper)}
.tile ul{margin:0;padding-left:16px;font-size:13px}
.tile ul.sig{padding-left:0}
@media (max-width:760px){.stages i{font-size:9.5px;letter-spacing:-.04em}}
.note{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:8px 10px;background:var(--note-bg);display:flex;flex-direction:column;gap:4px}
.note.k-answer{border-left-color:var(--me)} .note.k-counter{border-left-color:var(--seal)} .note.k-fact{border-left-color:var(--other)} .note.k-say{border-left-color:var(--seal);border-color:var(--seal)}
.note.pinned{box-shadow:0 0 0 2px var(--warn) inset}
.note .nh{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
.note .kind{font-weight:600;letter-spacing:.04em;color:var(--ink)}
.note .trig{flex:1 1 100%;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.note .nb{margin-left:auto;display:flex;gap:2px}
.note .nb button{border:none;background:transparent;padding:2px 6px;font-size:13px;color:var(--muted)}
.note .head{font-family:var(--f-display);font-size:16.5px;font-weight:600;line-height:1.4;text-wrap:pretty}
.note ul{margin:0;padding-left:16px;font-size:13.5px}
.note .facts{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px}
.note .facts b{color:var(--ink);font-weight:600}
.note.new{animation:slip .5s ease-out, glow 2.2s ease-out}
@keyframes slip{from{transform:translateY(-10px);opacity:.2}to{transform:none;opacity:1}}
@keyframes glow{0%{background:var(--warn-soft)}100%{background:var(--note-bg)}}
@media (prefers-reduced-motion:reduce){.note.new{animation:none}}
@media (max-width:760px){.note .head{font-size:15px} header button{padding:5px 9px;font-size:13px} h1{font-size:17px} .live-hide{display:none}}
button.ask{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:600;padding:9px 16px}
.pane{background:var(--paper);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.pane-h b{font-family:var(--f-display);font-size:14px;color:var(--ink)}
.pane-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.badge{font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.scroll{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.line{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.who{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;border:none;cursor:pointer;white-space:nowrap;margin-top:2px}
.who.me{background:var(--me-soft);color:var(--me)} .who.other{background:var(--other-soft);color:var(--other)} .who.unk{background:var(--bg);color:var(--muted)}
.line p{margin:0;min-width:0;overflow-wrap:anywhere}
.line time{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:6px}
.interim p{color:var(--muted);font-style:italic}
p.txt{cursor:text;border-radius:5px;padding:1px 3px;margin:-1px -3px}
p.txt:hover{background:var(--bg)}
.ed{font-size:11px;color:var(--me);margin-left:4px}
.edbox{display:flex;flex-direction:column;gap:5px;min-width:0}
.edbox textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1.5px solid var(--me);border-radius:7px;padding:6px 8px;width:100%;resize:vertical}
.edbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.edbar button{padding:5px 10px;font-size:13px}
.empty{color:var(--muted);font-size:13.5px;margin:auto;text-align:center;max-width:34ch}
.say-card{border:1.5px solid var(--seal);border-radius:10px;padding:10px 12px;background:var(--seal-soft)}
.say-card .k{font-size:11px;color:var(--seal);font-weight:600;letter-spacing:.08em}
.say-card .q{font-family:var(--f-display);font-size:18px;font-weight:600;margin:4px 0;text-wrap:balance}
.say-card .why{font-size:13px;color:var(--muted)}
.alt{font-size:13.5px;margin:6px 0 0;padding-left:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.box{border:1px solid var(--line);border-radius:10px;padding:9px 11px;flex:1 1 220px;min-width:0}
.box h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.meter{display:flex;gap:3px;margin:4px 0}
.meter i{flex:1;height:7px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--mood,var(--ok))}
.trend{display:flex;gap:2px;align-items:flex-end;height:18px;margin-top:4px}
.trend i{width:5px;border-radius:1px;background:var(--muted);opacity:.55}
.small{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;background:var(--other-soft);color:var(--other);padding:2px 9px;border-radius:99px}
.advice{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.advice:last-child{border-bottom:none}
.advice .row .box{flex:1 1 140px}
.advice:not(.latest) .say-card{border-color:var(--line);background:transparent}
.advice:not(.latest) .say-card .k{color:var(--muted)}
.advice:not(.latest) .q{font-size:16px}
.say-card .at{float:right;font-family:var(--f-mono);font-weight:400;letter-spacing:0}
.caution{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:500}
.ev{margin:0;padding-left:16px;font-size:13.5px}
.ev li+li{margin-top:5px}
.res{border-top:1px dashed var(--line);padding-top:7px;margin-top:7px;font-size:13.5px}
.res:first-of-type{border-top:none;margin-top:0;padding-top:0}
.res .qq{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.res p{margin:3px 0;white-space:pre-wrap}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.links a{font-size:12px;color:var(--me);background:var(--me-soft);padding:3px 9px;border-radius:99px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.hist{font-size:13px} details.hist summary{cursor:pointer;color:var(--muted)}
details.hist ol{padding-left:18px;margin:6px 0}
.thinking{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:7px 11px;font-size:13px;background:var(--paper)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.controls .grow{flex:1}
.hint{font-size:12px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.sheet{background:var(--paper);border-radius:12px;max-width:720px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;border:1px solid var(--line);overflow:hidden}
.sheet .scroll{padding:14px}
.sheet pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;background:var(--bg);border-radius:8px;padding:10px;margin:0}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;flex:none;background:var(--paper)}
.sheet-f button{min-width:84px;padding:10px 16px}
.sheet label.f,.sheet .box{flex:none}
.past{display:flex;flex-direction:column;gap:6px}
.past button{text-align:left;display:flex;justify-content:space-between;gap:8px}
.past time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.err{color:var(--seal);font-size:13px}
a{color:var(--me)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="seal" aria-hidden="true">秘書</div>
    <h1>1급 비서관 <small style="font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400">v3.3</small></h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">대기</span></div>
    <button id="pastBtn">지난 대화</button>
    <button id="setBtn" aria-label="설정">설정</button>
  </header>

  <form class="setup" id="setup">
    <label class="f">상대 이름<input id="pName" placeholder="예: 김민서 어머님" autocomplete="off" list="names"></label>
    <datalist id="names"></datalist>
    <label class="f">대화 종류<select id="pType">
      <option value="consult">학부모 상담</option><option value="career">학생 진학상담</option><option value="debate">토의·토론</option>
      <option value="rebuke">선생님 질책·피드백</option><option value="mentor">선배·멘토 조언 듣기</option><option value="listen">고민 들어주기</option><option value="daily">아내와 일상 대화</option><option value="etc">기타 (목적을 적어 주세요)</option></select></label>
    <label class="f" style="flex:2 1 220px">대화 목적 (선택)<input id="pPurpose" placeholder="예: 고1 내신 하락, 수학 반 이동 고민" autocomplete="off"></label>
    <button class="primary big" id="startBtn" type="submit">🎤 대화 시작</button>
    <div class="memo-chip" id="memoChip" hidden></div>
  </form>

  <div class="split">
    <section class="pane p-script" aria-label="속기록">
      <div class="pane-h"><b>속기록</b><span id="lineCount">0줄</span><span class="r"><span class="badge" id="exL">예시</span></span></div>
      <div class="scroll" id="script"></div>
    </section>
    <section class="pane p-notes" aria-label="비서실 쪽지">
      <div class="pane-h"><b>비서실 쪽지</b><span id="noteCount"></span><span class="thinking" id="noteThinking"></span><span class="r"><span class="badge" id="exN">예시</span></span></div>
      <div class="scroll" id="notes"></div>
    </section>
    <section class="pane p-mon" aria-label="상황판">
      <div class="pane-h"><b>상황판</b><span class="thinking" id="thinking"></span><span class="r"><span class="badge" id="exR">예시</span></span></div>
      <div class="scroll" id="brief"></div>
    </section>
  </div>

  <div class="controls" id="controls" hidden>
    <span class="small">다음 말</span>
    <div class="seg" role="group" aria-label="화자">
      <button type="button" data-spk="auto" aria-pressed="true">자동</button>
      <button type="button" data-spk="me" aria-pressed="false">나</button>
      <button type="button" data-spk="other" aria-pressed="false">상대</button>
    </div>
    <button id="pauseBtn">일시정지</button>
    <button id="askBtn" class="ask" title="지금 할 말을 쪽지로 받기">💡 지금 할 말</button>
    <span class="grow"></span>
    <button class="danger" id="endBtn">종료·정리</button>
  </div>
  <div class="hint live-hide-target" id="hint">대화 시작을 누르면 마이크가 계속 켜져서 끝날 때까지 받아 적습니다. 화자는 비서가 나눕니다. 이름표를 누르면 바뀝니다.</div>
</div>



<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="pane-h"><b id="sheetTitle"></b></div>
    <div class="scroll" id="sheetBody"></div>
    <div class="sheet-f" id="sheetFoot"></div>
  </div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const localDate=iso=>{const d=iso?new Date(iso):new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const LS={get(k,d){try{const v=localStorage.getItem("fs_"+k);return v==null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem("fs_"+k,JSON.stringify(v))}catch(_){}}};

const cfg=Object.assign({gkey:"",gmodel:"auto",me:"천양진 원장",interval:12,stt:"auto",chunk:15},LS.get("cfg",{}));
if(!/^(auto|gemini)/.test(cfg.gmodel)) cfg.gmodel="auto";
const S={notes:[],mon:null,live:false,paused:false,mode:"auto",lines:[],interim:"",cards:[],last:null,moods:[],setup:{},startedAt:null,memory:[],analyzedUpTo:0,busy:false,lastRun:0};

/* ---------------- example state ---------------- */
const EX_LINES=[
 {spk:"other",text:"원장님, 지난 중간고사 수학이 4등급이 나와서 애가 많이 위축됐어요.",t:"19:02:11"},
 {spk:"me",text:"네, 어머님. 성적표 같이 보면서 어디서 점수가 빠졌는지부터 짚어 보겠습니다.",t:"19:02:20"},
 {spk:"other",text:"다른 학원 옮겨야 하나 고민도 솔직히 하고 있어요.",t:"19:02:31"}];
const EX_CARD={say:"옮기실지 판단하시기 전에, 이번 시험에서 틀린 문항 유형만 먼저 같이 보시면 어떨까요? 원인이 보이면 결정이 훨씬 쉬워집니다.",
 why:"이탈 신호가 나왔습니다. 설득보다 판단을 돕는 사람 위치를 잡아야 주도권을 지킵니다.",
 alt:["4등급이 5등급제에서 어느 위치인지부터 설명드릴게요."],

let seenNotes=new Set();
function renderNotes(){
  const el=$("#notes"); const real=S.live||S.lines.length; const list=real?S.notes:EX_NOTES;

  const prevH=el.scrollHeight, prevTop=el.scrollTop;
  const ordered=[...list.filter(n=>n.pinned).reverse(),...list.filter(n=>!n.pinned).reverse()];
  el.innerHTML=ordered.map(n=>noteHTML(n,real&&!seenNotes.has(n.id))).join("");

$("#notes").addEventListener("click",e=>{

  const n=S.notes.find(x=>x.id===id); if(!n) return;

function addNotes(arr,forcedKind){
  const t=new Date().toTimeString().slice(0,5);
  for(const n of (arr||[])){ if(!n||!n.head) continue;
    S.notes.push({id:"n"+(++noteSeq),t,kind:forcedKind||n.kind||"주의",trigger:n.trigger||"",head:n.head,points:[].concat(n.points||[]).slice(0,3),facts:[].concat(n.facts||[]).slice(0,3),search:n.search||"",caution:n.caution||""}) }
  if(S.notes.length>60) S.notes=S.notes.filter(n=>n.pinned).concat(S.notes.filter(n=>!n.pinned).slice(-50));

function startRec(){
  if(!SR) return false;

  rec.onresult=e=>{
    let interim="";

      const r=e.results[i]; const txt=r[0].transcript.trim();

    }

}

const FALLBACK=["gemini-flash-latest","gemini-3.5-flash","gemini-flash-lite-latest","gemini-3.5-flash-lite"];
let modelOrder=null;
function models(){ if(cfg.gmodel!=="auto") return [cfg.gmodel,...FALLBACK.filter(m=>m!==cfg.gmodel)]; return modelOrder||FALLBACK; }
async function ai(prompt,maxTokens,temp){
  const parts=Array.isArray(prompt)?prompt:[{text:prompt}];
  let lastErr=null;
  for(const m of models()){
    try{
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",
        headers:{"content-type":"application/json","x-goog-api-key":cfg.gkey},
        body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:{responseMimeType:"application/json",maxOutputTokens:maxTokens,temperature:temp??0.6}})});
      const j=await r.json().catch(()=>({}));
      if(!r.ok){const e=new Error(j?.error?.message||("HTTP "+r.status));e.status=r.status;
        if(r.status===404||r.status===429||r.status===503){lastErr=e;continue}
        throw e}
      if(cfg.gmodel==="auto"&&m!==models()[0]) modelOrder=[m,...FALLBACK.filter(x=>x!==m)];
      return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
    }catch(e){ if(e.status) {if(e.status===404||e.status===429||e.status===503){lastErr=e;continue} throw e} lastErr=e }

let media=null, mr=null, actx=null, levelTimer=null, chunkTimer=null, voiced=0, chunkQ=[], chunkBusy=false, chunkStart=0, tickTimer=null;
function pickMime(){if(!window.MediaRecorder)return null;for(const m of ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4"]) if(MediaRecorder.isTypeSupported(m)) return m; return ""}

    t.outerHTML=`<div class="edbox"><textarea id="edTa" rows="3">${esc(l.text)}</textarea><div class="edbar"><button data-ed="save" class="primary">저장</button><button data-ed="cancel">취소</button><button data-ed="del" class="danger">줄 삭제</button><span class="small pending"></span></div></div>`;
    const ta=$("#edTa"); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); return }
  const b=e.target.closest("button.who");if(!b)return;
  const l=S.lines[+b.dataset.i]; if(!l) return; l.spk=l.spk==="me"?"other":"me"; l.fixed=true; renderScript()});
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{S.mode=b.dataset.spk;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}));
$("#askBtn").addEventListener("click",advise);
$("#pauseBtn").addEventListener("click",()=>{
  if(!S.live) return; S.paused=!S.paused;
  if(S.paused){stopListen(false);setStatus("일시정지","paused");$("#pauseBtn").textContent="다시 듣기"}
  else{startListen();setStatus("듣는 중 · "+(S.setup.name||S.setup.role),"live");$("#pauseBtn").textContent="일시정지"}
});

let wake=null;
async function keepAwake(){try{wake=await navigator.wakeLock?.request("screen")}catch(_){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.live){keepAwake(); if(!S.paused&&listenMode()==="web"){try{rec.start()}catch(_){}}}});

$("#setup").addEventListener("submit",e=>{
  e.preventDefault(); if(S.live) return;
  if(!SR&&listenMode()==="web"){openSheet("이 브라우저는 받아쓰기를 지원하지 않습니다",`<p>크롬(Chrome)으로 이 주소를 열어 주세요. 삼성 인터넷이나 사파리는 연속 받아쓰기를 지원하지 않습니다.</p>`,[["닫기",closeSheet]]);return}
  if(!cfg.gkey){openSettings(true);return}
  const ty=$("#pType").value; S.setup={type:ty,name:$("#pName").value.trim(),role:MODES[ty].partner,purpose:$("#pPurpose").value.trim()}; LS.set("lastType",ty);
  matchMemory();
  Object.assign(S,{live:true,paused:false,lines:[],interim:"",cards:[],last:null,mon:null,notes:[],moods:[],analyzedUpTo:0,lastRun:0,startedAt:new Date().toISOString()});
  $("#setup").hidden=true; $("#controls").hidden=false; $("#pauseBtn").textContent="일시정지";
  $("#hint").textContent="폰은 화면을 켜 둔 채 두 사람 사이에 놓아 주세요. 틀린 이름표는 누르면 바뀝니다."; setTimeout(()=>{if(S.live)$("#hint").classList.add("live-hide")},8000);
  setStatus("듣는 중 · "+(S.setup.name||S.setup.role),"live");
  seenNotes=new Set(); renderScript(); renderBrief(); renderNotes(); startListen(); keepAwake();
});
$("#endBtn").addEventListener("click",()=>{
  openSheet("대화를 마칠까요?",`<p>${S.lines.length}줄을 정리해서 기억해 둡니다.</p>`,[["계속하기",closeSheet],["종료·정리",finish,"primary"]]);
});

async function finish(){
  const wasAudio=listenMode()==="audio";
  S.live=false; stopListen(true); clearTimeout(analyzeTimer); try{wake?.release()}catch(_){}
  setStatus("정리 중","");
  openSheet("대화 정리 중",`<p class="thinking">${wasAudio?"마지막 말을 받아쓰고 ":""}대화를 요약하고 있습니다…</p>`,[]);
  if(wasAudio) await drainAudio();
  let sum=null;
  if(S.lines.length&&cfg.gkey){
    try{
      const out=await ai(`${cfg.me}('나')와 ${M().partner}의 대화 받아쓰기 기록입니다(오타 있음). 대화 종류: ${M().label}. 목적: ${mask(S.setup.purpose)||"미정"}.
${transcript(600)}
JSON 하나만 출력:
{"title":"노트 제목(20자 이내)","oneLine":"한 줄 요약","summary":"핵심 요약 3~5문장",
"points":["주요 내용"],"concerns":["${M().lists[0]}"],"promises":["원장이 약속하거나 합의한 것"],
"followups":["다음에 할 일(누가·언제)"],"persona":["상대 성향 태그"],"moodFlow":"대화 중 상대 기분 변화 한 줄",
"nextTip":"다음에 이 상대와 대화할 때 원장이 기억할 조언","tags":["옵시디언 태그(공백 없이, # 없이) 4~7개"]}`,3000);
      sum=parseJSON(out);
    }catch(e){}
  }
  sum=sum||{title:M().label+" 기록",oneLine:"",summary:"",points:[],concerns:[],promises:[],followups:[],persona:[],moodFlow:"",nextTip:"",tags:[]};
  const md=toMarkdown(sum);
  const rec2={type:S.setup.type,name:S.setup.name,role:S.setup.role,purpose:S.setup.purpose,startedAt:S.startedAt,endedAt:new Date().toISOString(),summary:sum,markdown:md};
  const all=sessions(); all.unshift(rec2); LS.set("sessions",all.slice(0,300)); refreshNames();
  const file=`${localDate(S.startedAt)} ${S.setup.name||M().partner} - ${sum.title||M().label}.md`.replace(/[\\/:*?"<>|]/g,"_");
  const autoSaved=await saveToVault(file,md);
  setStatus(autoSaved?"볼트에 저장됨":"정리 완료","");
  $("#setup").hidden=false; $("#controls").hidden=true; $("#hint").classList.remove("live-hide");
  $("#hint").textContent="대화 시작을 누르면 마이크가 계속 켜져서 끝날 때까지 받아 적습니다.";
  showNote(md,file,autoSaved);
}
function toMarkdown(s){
  const d=localDate(S.startedAt);
  const tags=["대화기록","1급비서관",M().label.replace(/[·\s]/g,"_"),...(s.tags||[])].map(t=>String(t).replace(/\s+/g,"_").replace(/^#/,"")).filter((v,i,a)=>v&&a.indexOf(v)===i);
  const li=a=>(a&&a.length?a.map(x=>`- ${x}`).join("\n"):"- 없음");
  return `---
date: ${d}
상대: ${S.setup.name||"미상"}
종류: ${M().label}
목적: ${S.setup.purpose||""}
tags: [${tags.join(", ")}]
---
# ${d} ${S.setup.name||M().partner} — ${s.title||M().label}

> ${s.oneLine||""}

## 요약
${s.summary||""}

## 주요 논의
${li(s.points)}

## ${M().lists[0]}
${li(s.concerns)}

## 약속·합의한 것
${li(s.promises)}

## 후속 조치
${(s.followups||[]).map(x=>`- [ ] ${x}`).join("\n")||"- 없음"}

## 상대 프로파일
- 성향: ${(s.persona||[]).join(", ")}
- 기분 흐름: ${s.moodFlow||""}
- 다음 대화 팁: ${s.nextTip||""}

## 받은 쪽지
${S.notes.length?S.notes.map(n=>`- (${n.t}) **${n.kind}** ${n.trigger?`“${n.trigger}” → `:""}${n.head}`).join("\n"):"- 없음"}

## 속기록
${S.lines.map(l=>`- **${l.spk==="me"?"나":S.setup.name||"상대"}** (${l.t}) ${l.text}`).join("\n")}

${tags.map(t=>"#"+t).join(" ")}
`;
}

/* ---------------- vault folder (laptop Chrome) ---------------- */
const IDB={db:null,async open(){if(this.db)return this.db;return this.db=await new Promise((res,rej)=>{const r=indexedDB.open("fs",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const d=await this.open();return new Promise(res=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})},
  async set(k,v){const d=await this.open();return new Promise(res=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)})}};
const canPickFolder=!!window.showDirectoryPicker;
async function saveToVault(name,md){
  if(!canPickFolder) return false;
  try{
    const dir=await IDB.get("vaultDir"); if(!dir) return false;
    let p=await dir.queryPermission({mode:"readwrite"});
    if(p!=="granted") p=await dir.requestPermission({mode:"readwrite"});
    if(p!=="granted") return false;
    const fh=await dir.getFileHandle(name,{create:true}); const w=await fh.createWritable(); await w.write(md); await w.close();
    return true;
  }catch(_){return false}
}
async function pickVault(){
  try{const dir=await window.showDirectoryPicker({mode:"readwrite",id:"fs-vault"}); await IDB.set("vaultDir",dir); return dir.name}catch(_){return null}
}

/* ---------------- sheets ---------------- */
function openSheet(title,body,btns){
  $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=body;
  const f=$("#sheetFoot"); f.innerHTML="";
  btns.forEach(([l,fn,cls])=>{const b=document.createElement("button");b.textContent=l;if(cls)b.className=cls;b.addEventListener("click",fn);f.appendChild(b)});
  $("#overlay").hidden=false;
}
function closeSheet(){$("#overlay").hidden=true}
function showNote(md,file,saved){
  openSheet("정리 완료",`<p class="small">${saved?"옵시디언 볼트 폴더에 저장했습니다.":"이 기기에 기억해 두었습니다. 같은 이름으로 다시 상담하면 비서가 참고합니다."}</p><pre id="mdOut">${esc(md)}</pre>`,[
    ["복사",copyMd],["파일로 저장",()=>download(file,md)],["닫기",closeSheet,"primary"]]);
}
async function copyMd(ev){const t=$("#mdOut").textContent;try{await navigator.clipboard.writeText(t);ev.target.textContent="복사됨"}catch(_){const r=document.createRange();r.selectNodeContents($("#mdOut"));const s=getSelection();s.removeAllRanges();s.addRange(r);ev.target.textContent="선택됨"}}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/markdown"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$("#pastBtn").addEventListener("click",()=>{
  const all=sessions();
  if(!all.length){openSheet("지난 상담","<p class='small'>아직 기억된 상담이 없습니다. 상담을 마치면 여기에 쌓입니다.</p>",[["닫기",closeSheet]]);return}
  openSheet("지난 상담",`<div class="past">${all.map((p,i)=>`<button data-i="${i}"><span><b>${esc(p.name||"이름 없음")}</b> · ${esc(p.summary?.title||"")}</span><time>${esc(localDate(p.endedAt))}</time></button>`).join("")}</div>`,[["닫기",closeSheet]]);
  $("#sheetBody").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{const p=all[+b.dataset.i];
    openSheet(p.summary?.title||"상담",`<pre id="mdOut">${esc(p.markdown||"")}</pre>`,[["복사",copyMd],["파일로 저장",()=>download(`${localDate(p.startedAt)} ${p.name||"상담"}.md`,p.markdown||"")],["닫기",closeSheet,"primary"]])}));
});

/* ---------------- settings ---------------- */
async function openSettings(first){
  const dir=canPickFolder?await IDB.get("vaultDir").catch(()=>null):null;
  openSheet(first?"처음 한 번만 설정해 주세요":"설정",`
    <div style="display:flex;flex-direction:column;gap:12px">
      <label class="f">구글 제미나이 API 키 (무료, 이 기기에만 저장)<input id="sKey" type="password" placeholder="AIza..." value="${esc(cfg.gkey)}" autocomplete="off"></label>
      <p class="small" style="margin:-6px 0 0">키 발급: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> → Create API key. 결제 정보는 넣지 마세요(넣으면 유료로 바뀝니다).</p>
      <label class="f">조언 엔진<select id="sModel">
        <option value="auto"${cfg.gmodel==="auto"?" selected":""}>자동 (권장)</option>
        <option value="gemini-flash-lite-latest"${cfg.gmodel==="gemini-flash-lite-latest"?" selected":""}>Flash-Lite — 빠르고 무료 한도 넉넉</option>
        <option value="gemini-flash-latest"${cfg.gmodel==="gemini-flash-latest"?" selected":""}>Flash — 조언이 더 깊음</option></select></label>
      <p class="small" style="margin:-6px 0 0">상대 이름은 구글로 보내지 않고 '상대'로 바꿔 보냅니다. 무료 키는 구글이 대화 내용을 검토·학습에 쓸 수 있습니다.</p>
      <label class="f">받아쓰기 방식<select id="sStt">
        <option value="auto"${cfg.stt==="auto"?" selected":""}>자동 — 폰은 녹음 방식, 노트북은 크롬 받아쓰기 (권장)</option>
        <option value="audio"${cfg.stt==="audio"?" selected":""}>녹음 방식 — 소리 없이 계속 녹음, 몇 초씩 늦게 뜸</option>
        <option value="web"${cfg.stt==="web"?" selected":""}>크롬 받아쓰기 — 바로 뜨지만 폰에선 '띵' 소리 반복</option></select></label>
      <label class="f">녹음 방식: 한 번에 보내는 길이<select id="sChunk">${[10,15,20,30].map(n=>`<option value="${n}"${cfg.chunk===n?" selected":""}>${n}초</option>`).join("")}</select></label>
      <label class="f">조언 갱신 간격 (크롬 받아쓰기)<select id="sInt">${[8,12,20,30].map(n=>`<option value="${n}"${cfg.interval===n?" selected":""}>${n}초</option>`).join("")}</select></label>
      <label class="f">내 이름<input id="sMe" value="${esc(cfg.me)}"></label>
      ${canPickFolder?`<div class="box"><h3>옵시디언 볼트 자동 저장 (노트북)</h3>
        <p class="small" style="margin:0 0 6px">${dir?`지금 저장 폴더: <b>${esc(dir.name)}</b>`:"구글 드라이브의 볼트 폴더를 고르면 상담 노트가 자동으로 들어갑니다."}</p>
        <button type="button" id="sPick">${dir?"폴더 바꾸기":"폴더 고르기"}</button></div>`:`<p class="small">폰에서는 상담 노트를 이 기기에 기억하고, '파일로 저장'으로 내려받을 수 있습니다. 볼트 자동 저장은 노트북 크롬에서 됩니다.</p>`}
    </div>`,[["취소",closeSheet],["저장",saveSettings,"primary"]]);
  $("#sPick")?.addEventListener("click",async ev=>{const n=await pickVault(); if(n) ev.target.previousElementSibling.innerHTML=`지금 저장 폴더: <b>${esc(n)}</b>`});
}
function saveSettings(){
  cfg.gkey=$("#sKey").value.trim(); cfg.gmodel=$("#sModel").value; modelOrder=null; cfg.interval=+$("#sInt").value; cfg.stt=$("#sStt").value; cfg.chunk=+$("#sChunk").value; cfg.me=$("#sMe").value.trim()||"천양진 원장";
  LS.set("cfg",cfg); closeSheet();
  if(cfg.gkey&&!S.live) $("#hint").textContent="설정을 저장했습니다. 상담 시작을 누르세요.";
}
$("#setBtn").addEventListener("click",()=>openSettings(false));

/* ---------------- boot ---------------- */
refreshNames(); try{$("#pType").value=LS.get("lastType","consult")}catch(_){}; renderScript(); renderBrief(); renderNotes();
if(!SR&&listenMode()==="web") $("#hint").innerHTML='<span class="err">이 브라우저는 연속 받아쓰기를 지원하지 않습니다. 크롬으로 열어 주세요.</span>';
else if(!cfg.gkey) $("#hint").textContent="처음 한 번 '설정'에서 제미나이 무료 키를 넣어 주세요. 그다음부터는 상담 시작만 누르면 됩니다.";
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
