name: Deploy 더이룸학원 to GitHub Pages

on:
  push:
    branches:
      - claude/markdown-second-brain-app-MRH7Q
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 홈페이지 파일만 공개 (brain/, .claude/, CLAUDE.md 등 개인 파일 제외)
      - name: Collect site files
        run: |
          mkdir _site
          find . \( -path ./_site -o -path ./brain -o -path './.*' \) -prune -o -type f \
            \( -iname '*.html' -o -iname '*.css' -o -iname '*.js' -o -iname '*.png' -o -iname '*.jpg' \
               -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.svg' -o -iname '*.ico' \
               -o -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mp3' -o -iname '*.pdf' \) -exec cp --parents {} _site/ \;
          find _site -type f
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
